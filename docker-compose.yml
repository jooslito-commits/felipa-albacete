services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /data
      APP_TIMEZONE: Europe/Madrid
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "3000:3000"
    volumes:
      - felipa-data:/data
volumes:
  felipa-data:
